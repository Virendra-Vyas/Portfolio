<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="t d" font-family="Archivo, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">GovBridge UK architecture</title>
  <desc id="d">Three kinds of client call the GovBridge API: developers' applications over REST with an API key, the React developer portal on Cloudflare Pages, and AI clients (a Python tool-calling agent and an MCP server). The GovBridge API is an ASP.NET Core service on Render in Frankfurt that exposes one consistent contract over 40+ endpoints, with rate limiting per API key, encrypted OAuth token storage, HMRC fraud prevention headers, log redaction of NINO, UTR and VRN, a SandboxOnly guard attribute and explicit "HMRC not connected" errors. It uses PostgreSQL on Supabase and Redis on Upstash, and calls six UK government services: HMRC Making Tax Digital (VAT, Income Tax, PAYE, CIS, Savings Income), HMRC GovTalk for Corporation Tax CT600 returns with an IRmark, Companies House, DVLA, Land Registry and the Food Hygiene Rating Scheme.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55555e"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #512bd4; font-weight: 600; }
      .box { fill: #ffffff; stroke: #c4c4bc; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #141418; }
      .sub { font-size: 13px; fill: #55555e; }
      .gateway { fill: #f7f6fd; stroke: #512bd4; stroke-width: 2; }
      .gw-title { font-size: 20px; font-weight: 700; fill: #512bd4; }
      .chip { fill: #ece8fb; stroke: none; }
      .chip-text { font-size: 13px; font-weight: 500; fill: #512bd4; }
      .line { stroke: #55555e; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Clients -->
  <text class="label" x="20" y="24">Clients</text>
  <rect class="box" x="20" y="36" width="280" height="80" rx="8"/>
  <text class="title" x="160" y="68" text-anchor="middle">Developers' applications</text>
  <text class="sub" x="160" y="92" text-anchor="middle">REST with an API key</text>

  <rect class="box" x="340" y="36" width="280" height="80" rx="8"/>
  <text class="title" x="480" y="68" text-anchor="middle">Developer portal</text>
  <text class="sub" x="480" y="92" text-anchor="middle">React on Cloudflare Pages</text>

  <rect class="box" x="660" y="36" width="280" height="80" rx="8"/>
  <text class="title" x="800" y="68" text-anchor="middle">AI clients</text>
  <text class="sub" x="800" y="92" text-anchor="middle">Python tool-calling agent · MCP server</text>

  <path class="line" d="M160 116 V166" marker-end="url(#arrow)"/>
  <path class="line" d="M480 116 V166" marker-end="url(#arrow)"/>
  <path class="line" d="M800 116 V166" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect class="gateway" x="20" y="170" width="920" height="210" rx="10"/>
  <text class="gw-title" x="40" y="206">GovBridge API</text>
  <text class="sub" x="40" y="232">ASP.NET Core on Render (Frankfurt) · one consistent contract over 40+ endpoints</text>

  <rect class="chip" x="40" y="256" width="286" height="44" rx="6"/>
  <text class="chip-text" x="183" y="283" text-anchor="middle">Rate limiting per API key</text>
  <rect class="chip" x="347" y="256" width="286" height="44" rx="6"/>
  <text class="chip-text" x="490" y="283" text-anchor="middle">Encrypted OAuth token storage</text>
  <rect class="chip" x="654" y="256" width="266" height="44" rx="6"/>
  <text class="chip-text" x="787" y="283" text-anchor="middle">HMRC fraud prevention headers</text>

  <rect class="chip" x="40" y="314" width="286" height="44" rx="6"/>
  <text class="chip-text" x="183" y="341" text-anchor="middle">Log redaction: NINO, UTR, VRN</text>
  <rect class="chip" x="347" y="314" width="286" height="44" rx="6"/>
  <text class="chip-text" x="490" y="341" text-anchor="middle">SandboxOnly guard attribute</text>
  <rect class="chip" x="654" y="314" width="266" height="44" rx="6"/>
  <text class="chip-text" x="787" y="341" text-anchor="middle">"HMRC not connected" errors</text>

  <path class="line" d="M140 380 V446" marker-end="url(#arrow)"/>
  <path class="line" d="M620 380 V446" marker-end="url(#arrow)"/>

  <!-- Data -->
  <text class="label" x="20" y="464">Data</text>
  <rect class="box" x="20" y="476" width="240" height="80" rx="8"/>
  <text class="title" x="140" y="510" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="140" y="534" text-anchor="middle">Supabase</text>
  <rect class="box" x="20" y="572" width="240" height="80" rx="8"/>
  <text class="title" x="140" y="606" text-anchor="middle">Redis</text>
  <text class="sub" x="140" y="630" text-anchor="middle">Upstash</text>

  <!-- Government APIs -->
  <text class="label" x="300" y="464">UK government APIs</text>
  <rect class="box" x="300" y="476" width="200" height="80" rx="8"/>
  <text class="title" x="400" y="500" text-anchor="middle">HMRC MTD</text>
  <text class="sub" x="400" y="522" text-anchor="middle">VAT, Income Tax, PAYE,</text>
  <text class="sub" x="400" y="540" text-anchor="middle">CIS, Savings Income</text>

  <rect class="box" x="520" y="476" width="200" height="80" rx="8"/>
  <text class="title" x="620" y="500" text-anchor="middle">HMRC GovTalk</text>
  <text class="sub" x="620" y="522" text-anchor="middle">Corporation Tax (CT600)</text>
  <text class="sub" x="620" y="540" text-anchor="middle">with IRmark</text>

  <rect class="box" x="740" y="476" width="200" height="80" rx="8"/>
  <text class="title" x="840" y="521" text-anchor="middle">Companies House</text>

  <rect class="box" x="300" y="572" width="200" height="80" rx="8"/>
  <text class="title" x="400" y="617" text-anchor="middle">DVLA</text>

  <rect class="box" x="520" y="572" width="200" height="80" rx="8"/>
  <text class="title" x="620" y="617" text-anchor="middle">Land Registry</text>

  <rect class="box" x="740" y="572" width="200" height="80" rx="8"/>
  <text class="title" x="840" y="600" text-anchor="middle">FHRS</text>
  <text class="sub" x="840" y="624" text-anchor="middle">Food hygiene ratings</text>
</svg>
