<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Archivo, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">DeviceHub role-based access control</title>
  <desc id="d">Requests flow from the React app to the backend-for-frontend, then to the core API, then to the database. The React app has an AuthContext with a can() helper that drives permission-driven UI. The backend-for-frontend and the core API both enforce permissions, using JWT bearer authentication and a dedicated authorisation library. Roles and permissions live in the database and are managed through EF Core migrations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55555e"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #512bd4; font-weight: 600; }
      .box { fill: #ffffff; stroke: #c4c4bc; stroke-width: 1.5; }
      .key { fill: #f7f6fd; stroke: #512bd4; stroke-width: 2; }
      .title { font-size: 16px; font-weight: 700; fill: #141418; }
      .sub { font-size: 13px; fill: #55555e; }
      .chip { fill: #ece8fb; }
      .chip-text { font-size: 13px; font-weight: 500; fill: #512bd4; }
      .line { stroke: #55555e; stroke-width: 1.5; fill: none; }
      .dash { stroke: #512bd4; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <text class="label" x="20" y="28">Request path</text>

  <!-- React app -->
  <rect class="box" x="20" y="44" width="200" height="164" rx="8"/>
  <text class="title" x="120" y="76" text-anchor="middle">React app</text>
  <text class="sub" x="120" y="98" text-anchor="middle">Permission-driven UI</text>
  <rect class="chip" x="36" y="116" width="168" height="36" rx="6"/>
  <text class="chip-text" x="120" y="139" text-anchor="middle">AuthContext</text>
  <rect class="chip" x="36" y="160" width="168" height="36" rx="6"/>
  <text class="chip-text" x="120" y="183" text-anchor="middle">can() helper</text>

  <path class="line" d="M220 126 H256" marker-end="url(#arrow)"/>

  <!-- BFF -->
  <rect class="key" x="260" y="44" width="200" height="164" rx="8"/>
  <text class="title" x="360" y="90" text-anchor="middle">Backend-for-frontend</text>
  <rect class="chip" x="276" y="116" width="168" height="36" rx="6"/>
  <text class="chip-text" x="360" y="139" text-anchor="middle">Enforces permissions</text>

  <path class="line" d="M460 126 H496" marker-end="url(#arrow)"/>

  <!-- Core API -->
  <rect class="key" x="500" y="44" width="200" height="164" rx="8"/>
  <text class="title" x="600" y="90" text-anchor="middle">Core API</text>
  <rect class="chip" x="516" y="116" width="168" height="36" rx="6"/>
  <text class="chip-text" x="600" y="139" text-anchor="middle">Enforces permissions</text>

  <path class="line" d="M700 126 H736" marker-end="url(#arrow)"/>

  <!-- Database -->
  <rect class="box" x="740" y="44" width="200" height="164" rx="8"/>
  <text class="title" x="840" y="90" text-anchor="middle">Database</text>
  <rect class="chip" x="756" y="116" width="168" height="36" rx="6"/>
  <text class="chip-text" x="840" y="139" text-anchor="middle">Roles and permissions</text>
  <rect class="chip" x="756" y="160" width="168" height="36" rx="6"/>
  <text class="chip-text" x="840" y="183" text-anchor="middle">EF Core migrations</text>

  <!-- Shared auth band under BFF and Core API -->
  <path class="dash" d="M360 208 V260"/>
  <path class="dash" d="M600 208 V260"/>
  <text class="label" x="260" y="252">Authentication and authorisation</text>
  <rect class="box" x="260" y="264" width="440" height="64" rx="8"/>
  <text class="chip-text" x="480" y="292" text-anchor="middle">JWT bearer authentication</text>
  <text class="chip-text" x="480" y="314" text-anchor="middle">Dedicated authorisation library</text>

  <text class="sub" x="20" y="376">Permissions are checked in both the backend-for-frontend and the core API, and the UI uses</text>
  <text class="sub" x="20" y="394">the same model to decide what to show.</text>
</svg>
