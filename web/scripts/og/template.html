<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; font-family: Archivo, sans-serif; color: #141418; background: #f4f4f1; }
  .card { width: 100%; height: 100%; padding: 56px 64px; display: flex; flex-direction: column; }
  h1 { font-size: 132px; font-weight: 800; font-variation-settings: "wdth" 125; letter-spacing: -0.045em; line-height: 0.9; padding-bottom: 22px; border-bottom: 3px solid #141418; white-space: nowrap; }
  .lead { margin-top: 22px; font-size: 30px; font-weight: 500; font-variation-settings: "wdth" 104; letter-spacing: -0.01em; }
  .trace { position: relative; margin-top: auto; padding-bottom: 30px; background: repeating-linear-gradient(90deg, #dadad3 0 1px, transparent 1px 108.10px) top / 100% calc(100% - 30px) no-repeat; }
  .row { position: relative; display: block; height: 22px; }
  .bar { position: absolute; top: 5px; height: 12px; border-radius: 4px; }
  .employment { background: #512bd4; }
  .company { background: #009a7a; }
  .freelance { background: #c96a12; }
  .current { border-radius: 4px 0 0 4px; }
  .year { position: absolute; bottom: 0; padding-left: 5px; border-left: 2px solid #85857d; font-size: 19px; font-variation-settings: "wdth" 82; color: #55555e; }
</style>
</head>
