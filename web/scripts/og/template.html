<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with: node scripts/og/render.mjs
     Text is copied from content/profile.ts; the spans are content/timeline.ts as of October 2026. Keep them in step. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; font-family: Manrope, sans-serif; color: #0f1b2d; background: radial-gradient(700px 320px at 95% -10%, rgba(255,107,87,0.16), transparent 70%), radial-gradient(700px 340px at 0% -10%, rgba(31,111,184,0.18), transparent 70%), linear-gradient(180deg, #edf4fb, #f8fbfe); }
  .card { width: 100%; height: 100%; padding: 56px 64px; display: flex; flex-direction: column; }
  h1 { font-size: 150px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95; padding-bottom: 26px; background: linear-gradient(100deg, #0f1b2d 0%, #0b4f8a 55%, #0a6b60 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
  .lead { margin-top: 22px; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; padding-top: 22px; background: linear-gradient(90deg, #1f6fb8 0 54%, transparent 54% 55%, #0fa594 55% 84%, transparent 84% 85%, #f2604b 85%) top / 100% 6px no-repeat; }
  .trace { position: relative; margin-top: auto; padding-bottom: 30px; background: repeating-linear-gradient(90deg, #dce6f0 0 1px, transparent 1px 108.10px) top / 100% calc(100% - 30px) no-repeat; }
  .row { position: relative; display: block; height: 22px; }
  .bar { position: absolute; top: 5px; height: 12px; border-radius: 4px; }
  .employment { background: #1f6fb8; }
  .company { background: #0fa594; }
  .freelance { background: #f2604b; }
  .current { border-radius: 4px 0 0 4px; }
  .year { position: absolute; bottom: 0; padding-left: 5px; border-left: 2px solid #7a8aa0; font-size: 18px; color: #4a5a70; }
</style>
</head>
<body>
  <div class="card">
